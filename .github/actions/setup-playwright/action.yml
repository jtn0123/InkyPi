name: Set up Playwright Chromium
description: >-
  The browser setup every job that renders with Playwright shares: Chromium
  and its OS dependencies, then an AppArmor allowance that lets that one
  headless-shell binary create the user namespaces its sandbox needs. Run it
  after setup-python-deps, whose .venv provides the playwright package.

runs:
  using: composite
  steps:
    - name: Install Playwright Chromium
      shell: bash
      run: python -m playwright install --with-deps chromium

    # Ubuntu 24.04 restricts user namespaces for downloaded binaries, which
    # Chromium's sandbox needs. Permit only this exact test binary, rather
    # than turning the restriction (or the sandbox) off.
    - name: Allow the test browser to create its sandbox namespaces
      shell: bash
      run: |
        if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] &&
           [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == "1" ]]; then
          python - <<'PYPROFILE' > /tmp/inkypi-headless-shell.apparmor
        from pathlib import Path
        from playwright.sync_api import sync_playwright
        with sync_playwright() as p:
            executable = Path(p.chromium.executable_path)
        cache = executable.parents[2]
        revision = executable.parents[1].name.removeprefix("chromium-")
        binaries = list(cache.glob(f"chromium_headless_shell-{revision}/**/headless_shell"))
        binaries += list(cache.glob(f"chromium_headless_shell-{revision}/**/chrome-headless-shell"))
        assert len(binaries) == 1, binaries
        print('abi <abi/4.0>,')
        print('include <tunables/global>')
        print(f'profile inkypi-headless-shell "{binaries[0]}" flags=(unconfined) {{')
        print('  userns,')
        print('}')
        PYPROFILE
          sudo apparmor_parser -r /tmp/inkypi-headless-shell.apparmor
        fi
