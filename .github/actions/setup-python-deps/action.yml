name: Set up Python and project dependencies
description: >-
  CI's one Python setup. Installs Python, optionally the OS libraries the
  renderer and tests need, then the hashed lockfiles into .venv with uv,
  the same tool and --require-hashes check the Pi installer uses. Later steps
  in the job run with .venv first on PATH, so `python`, `pytest` and the
  other tools come from it, and scripts/preflash_validate.sh finds the .venv
  it requires.

inputs:
  python-version:
    description: Python version for actions/setup-python.
    required: false
    default: '3.13'
  requirements:
    description: Space-separated lockfiles to install, all hash-checked.
    required: false
    default: install/requirements.txt install/requirements-dev.txt
  os-packages:
    description: >-
      'true' to apt-get install the image and font libraries the renderer and
      tests need. Linux only; ignored on other runners.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install OS libraries
      if: inputs.os-packages == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libopenjp2-7 \
          libopenblas-dev \
          libfreetype6-dev \
          fonts-noto-color-emoji

    # uv is pinned by hash in its own lockfile, as in install/install.sh. It
    # goes into the setup-python interpreter, not .venv, so a runtime-only
    # .venv holds nothing but the runtime lockfile.
    - name: Install uv
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check --quiet \
          --require-hashes -r install/uv-requirements.txt
        python -m uv --version

    # --compile-bytecode matches pip, which writes .pyc files at install time;
    # without it the first import compiles them, which skews the cold-start
    # benchmarks.
    - name: Install lockfiles into .venv
      shell: bash
      env:
        REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        read -r -a lockfiles <<< "$REQUIREMENTS"
        args=()
        for lockfile in "${lockfiles[@]}"; do
          args+=(-r "$lockfile")
        done
        python -m venv .venv
        python -m uv pip install --python .venv/bin/python \
          --require-hashes --compile-bytecode "${args[@]}"
        .venv/bin/python -m pip check
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
