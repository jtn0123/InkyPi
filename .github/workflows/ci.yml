name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
  # One nightly run. Every job here runs on each schedule event, so a second
  # cron reruns the whole suite; the weekly macOS pre-flash has its own
  # workflow (preflash-macos-weekly.yml) for that reason.
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read
  pull-requests: write

concurrency:
  # The event name is part of the key so a push to main (same ref) can no
  # longer cancel an in-flight scheduled run (soak / mutation nightlies take
  # up to 2h). Superseded PR pushes still cancel their previous run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD^1 is the base the hygiene hooks below diff against: the PR's
          # base branch for a PR's merge commit, the previous commit on main.
          fetch-depth: 2
      - uses: ./.github/actions/setup-python-deps
        with:
          requirements: install/requirements-dev.txt
      # Also runs scripts/check_shell.sh (bash -n + shellcheck on every
      # tracked shell script), the only shellcheck run in CI.
      - name: Lint and type-check
        env:
          CI: true
        run: scripts/lint.sh
      # Biome lints every web UI script (src/static/scripts/; the rules are in
      # biome.json). Lint only: biome.json turns the formatter off. The version
      # is the one the biome-ci pre-commit hook pins;
      # tests/unit/test_biome_config.py keeps the two in step.
      - name: Install Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.6.7
      - name: Lint web scripts (Biome)
        run: biome ci --error-on-warnings
      # The same hooks a local commit runs, on the files this change touches,
      # so a commit made without `pre-commit install` (or with --no-verify)
      # fails here rather than leaving whitespace or broken YAML on main.
      # Ruff, Black and mypy are skipped because lint.sh above already ran
      # them on every file, and biome-ci because the step above linted every
      # script; gitleaks has its own workflow (gitleaks.yml).
      - name: Pre-commit hooks on changed files
        env:
          SKIP: ruff,black,mypy,biome-ci,gitleaks,browser-smoke-gate
        run: pre-commit run --show-diff-on-failure --from-ref HEAD^1 --to-ref HEAD
      # Blocks GPL-3/AGPL-3 (not LGPL or GPL-2); the policy and its one
      # exemption live in the script. pip-licenses is the exact, hashed pin
      # from install/requirements-dev.txt installed above.
      - name: Check dependency licenses
        run: scripts/check_licenses.sh
      # Restore and save are separate steps so that only main writes the
      # baseline, under a new key each run. actions/cache never saves over a
      # key that already exists, so a fixed key froze the baseline at the
      # first main run that wrote it. Restore takes the newest key with the
      # prefix.
      - name: Restore benchmark baseline cache
        id: bench-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bench-baseline.json
          key: benchmark-baseline-${{ runner.os }}-py3.13-${{ github.run_id }}
          # The last entry also matches the old fixed-key cache until main
          # saves its first per-run baseline.
          restore-keys: |
            benchmark-baseline-${{ runner.os }}-py3.13-
            benchmark-baseline-${{ runner.os }}-
      - name: Run perf benchmarks
        env:
          SKIP_BROWSER: '1'
          BENCHMARK_THRESHOLD_PCT: ${{ vars.BENCHMARK_THRESHOLD_PCT || '15' }}
          PERF_PLUGIN_RENDER_BUDGET_MS: ${{ vars.PERF_PLUGIN_RENDER_BUDGET_MS || '2000' }}
          PERF_COLD_START_BUDGET_S: ${{ vars.PERF_COLD_START_BUDGET_S || '3' }}
          PERF_COLD_START_SAMPLES: ${{ vars.PERF_COLD_START_SAMPLES || '3' }}
          PERF_COLD_START_TIMEOUT_S: ${{ vars.PERF_COLD_START_TIMEOUT_S || '90' }}
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          set -o pipefail
          python -m pytest tests/benchmarks/ --benchmark-only \
            --benchmark-columns=min,mean,median,stddev,ops \
            --benchmark-json=/tmp/bench-current.json -q
          # Compare against CI-cached baseline if available, otherwise
          # fall back to the repo-committed baseline. Both paths are blocking
          # so cache misses cannot silently hide PR regressions.
          if [ -f /tmp/bench-baseline.json ]; then
            echo "Using CI cached benchmark baseline." | tee /tmp/benchmark-compare.txt
            cp /tmp/bench-baseline.json /tmp/bench-effective-baseline.json
            # --expected: a benchmark this PR deleted (and removed from the
            # committed baseline) is retired, not "missing".
            python scripts/benchmark_compare.py \
              --baseline /tmp/bench-effective-baseline.json \
              --current /tmp/bench-current.json \
              --expected tests/benchmarks/baseline.json \
              | tee -a /tmp/benchmark-compare.txt
          else
            echo "No CI baseline cache found — using repo baseline as blocking fallback." \
              | tee /tmp/benchmark-compare.txt
            cp tests/benchmarks/baseline.json /tmp/bench-effective-baseline.json
            python scripts/benchmark_compare.py \
              --baseline /tmp/bench-effective-baseline.json \
              --current /tmp/bench-current.json \
              | tee -a /tmp/benchmark-compare.txt
          fi
          # JTN-738: hard performance budgets on plugin render latency and
          # cold-start startup time.
          python scripts/perf_budget_gate.py --bench-json /tmp/bench-current.json
          # On main branch pushes, update the cached baseline for future PRs
          if [ "$GITHUB_REF_VALUE" = "refs/heads/main" ]; then
            cp /tmp/bench-current.json /tmp/bench-baseline.json
          fi
      - name: Save benchmark baseline cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bench-baseline.json
          key: benchmark-baseline-${{ runner.os }}-py3.13-${{ github.run_id }}
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            /tmp/bench-current.json
            /tmp/benchmark-compare.txt
            /tmp/bench-effective-baseline.json
          if-no-files-found: ignore

  lockfile-drift:
    name: Lockfile drift check
    runs-on: ubuntu-latest
    # JTN-616: migrated to `uv lock` + `uv export` for a universal cross-platform
    # lockfile. This now blocks merge because the runtime lockfile is part of
    # the release contract and is regenerated from uv.lock.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv
        run: python -m pip install --require-hashes -r install/uv-requirements.txt
      - name: Check requirements drift
        run: bash scripts/check_requirements_drift.sh

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.13' ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python ${{ matrix.python-version }} and dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ matrix.python-version }}
          os-packages: 'true'
      - name: Run tests
        env:
          INKYPI_ENV: dev
          INKYPI_NO_REFRESH: '1'
          PYTHONPATH: src
          # Explicit, visible opt-out: this job installs no Chromium. Under
          # CI=true tests/conftest.py turns a silently dropped browser suite
          # into a collection error, so the deselection has to be stated.
          # The UI/a11y/journey suites run in `browser-full`; smoke, plugin
          # snapshots and visual regression run in `browser-smoke`.
          SKIP_BROWSER: '1'
          # Process-wide (not only while a test runs), so the SIGABRT below
          # dumps every thread even if the hang is at session teardown.
          PYTHONFAULTHANDLER: '1'
        run: |
          # Keep CI serial while the local pytest-xdist path soaks.
          # Note: tests/snapshots/ are collected here but skip automatically
          # because REQUIRE_BROWSER_SMOKE is not set (they need Playwright
          # Chromium which isn't installed in this job). The browser-smoke
          # job runs them with a real browser.
          # Container tests (`-m container`) are excluded here and run in the
          # `install-crash-loop-gate` job ("Systemd container gates"): they
          # boot systemd in Docker, and adding them to this job pushed it past
          # its 20-minute cap.
          #
          # Hang diagnostics: a hung run used to reach timeout-minutes, ignore
          # the cancel, get force-killed and lose its whole log (runs
          # 43345263063 and 43668709714). Stop it ourselves first: SIGABRT
          # makes faulthandler print every thread's stack and the step fails
          # normally, so the log survives. A normal run takes 7-10 minutes.
          # faulthandler_timeout also dumps stacks for a single test stuck
          # where pytest-timeout's signal can't reach it (blocked in C code).
          timeout --signal=ABRT --kill-after=30s 16m \
            pytest --cov --cov-report=xml -q -m "not container" \
              -o faulthandler_timeout=110
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  sonarcloud:
    name: SonarCloud Scan
    needs: [tests]
    runs-on: ubuntu-latest
    # Dependabot PRs cannot read repo secrets, so SONAR_TOKEN is empty and the
    # scan always fails. Skip it rather than report a misleading red check.
    # !cancelled(), not always(): the scan should still run when tests fail,
    # because the tests job uploads coverage regardless. But when a newer push
    # cancels this run there is no coverage, and a scan posts "0% coverage on
    # new code, Quality Gate failed" on the PR.
    if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-3.13
        continue-on-error: true
      - name: SonarCloud Scan
        continue-on-error: true  # a dead SONAR_TOKEN must not gate a PR
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The web-only boot smoke: runtime lockfile only, on Debian Trixie's own
  # python3 (what the Pi runs), so it uses pip in a plain venv rather than the
  # shared setup action. It also carries the health/API probes of the old
  # smoke-matrix web-only leg, which booted the same way with dev deps added.
  smoke:
    name: Install smoke (container)
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OS dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3 python3-venv python3-pip git curl \
            libopenjp2-7 libopenblas-dev libfreetype6-dev \
            fonts-noto-color-emoji
      - name: Setup virtualenv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip wheel
      - name: Install Python dependencies
        run: |
          . .venv/bin/activate
          pip install -r install/requirements.txt
          pip check
      - name: Import smoke
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import flask, PIL, requests, urllib3, numpy, icalendar, psutil, waitress
          import zoneinfo, feedparser
          print("Imports OK")
          PY
      - name: Boot web-only and probe routes
        env:
          INKYPI_ENV: dev
          INKYPI_NO_REFRESH: '1'
          PYTHONPATH: src
        run: |
          . .venv/bin/activate
          python src/inkypi.py --dev --web-only &
          SERVER_PID=$!

          # Wait for server to start and determine the correct URL
          SERVER_URL=""
          for _ in $(seq 1 30); do
            # Try localhost first (most common case)
            if curl -fsS --max-time 2 http://127.0.0.1:8080/ >/dev/null 2>&1; then
              SERVER_URL="http://127.0.0.1:8080"
              break
            fi
            # Try common container IPs
            for ip in 172.18.0.2 172.17.0.2; do
              if curl -fsS --max-time 2 http://${ip}:8080/ >/dev/null 2>&1; then
                SERVER_URL="http://${ip}:8080"
                break 2
              fi
            done
            sleep 1
          done

          if [ -z "$SERVER_URL" ]; then
            echo "Server did not start within 30 seconds" >&2
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "Using server URL: $SERVER_URL"

          # Test all routes — use a cookie jar so CSRF session is preserved
          COOKIES=$(mktemp)
          curl -fsS -c "$COOKIES" ${SERVER_URL}/ -o /tmp/home.html
          CSRF_TOKEN=$(sed -n 's/.*csrf-token.*content="\([^"]*\)".*/\1/p' /tmp/home.html | head -1)
          curl -fsS ${SERVER_URL}/healthz >/dev/null
          curl -fsS ${SERVER_URL}/readyz >/dev/null || true
          curl -fsS -b "$COOKIES" ${SERVER_URL}/settings >/dev/null
          curl -fsS -b "$COOKIES" ${SERVER_URL}/playlist >/dev/null
          curl -fsS -b "$COOKIES" ${SERVER_URL}/api/health/system >/dev/null
          curl -fsS -b "$COOKIES" ${SERVER_URL}/api/health/plugins >/dev/null
          curl -fsS -b "$COOKIES" ${SERVER_URL}/api/benchmarks/summary >/dev/null
          curl -sS -b "$COOKIES" -o /dev/null -w '%{http_code}\n' ${SERVER_URL}/preview | tee preview_code.txt
          grep -q '^200$' preview_code.txt || { echo "Preview route did not return 200" >&2; kill $SERVER_PID 2>/dev/null || true; exit 1; }
          curl -fsS -b "$COOKIES" ${SERVER_URL}/plugin/clock >/dev/null
          curl -fsS -b "$COOKIES" ${SERVER_URL}/images/clock/faces/digital.png >/dev/null
          curl -fsS -b "$COOKIES" "${SERVER_URL}/download-logs?hours=2" >/dev/null
          curl -fsS -b "$COOKIES" "${SERVER_URL}/api/logs?hours=2&limit=200" >/dev/null
          curl -fsS -b "$COOKIES" -X POST -H "X-CSRFToken: $CSRF_TOKEN" -d 'plugin_id=clock' ${SERVER_URL}/save_plugin_settings >/dev/null
          curl -fsS -b "$COOKIES" -X POST -H "X-CSRFToken: $CSRF_TOKEN" -d 'plugin_id=clock' ${SERVER_URL}/update_now >/dev/null
          rm -f "$COOKIES"
          if [ ! -f src/static/images/processed_image.png ] && [ ! -f runtime/mock_display_output/latest.png ]; then
            echo "Expected preview image not found" >&2
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          curl -fsS ${SERVER_URL}/preview >/dev/null

          # Cleanup
          kill $SERVER_PID 2>/dev/null || true

  # Boots the full app with the refresh loop running (no --web-only). Its old
  # web-only leg duplicated the `smoke` job's boot and now lives there.
  smoke-refresh:
    name: Runtime smoke (dev-refresh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-deps
      - name: Launch and probe
        env:
          INKYPI_ENV: dev
          INKYPI_NO_REFRESH: '0'
          PYTHONPATH: src
        run: |
          python src/inkypi.py --dev &
          PID=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz >/dev/null
          curl -fsS http://127.0.0.1:8080/readyz >/dev/null || true
          curl -fsS http://127.0.0.1:8080/settings >/dev/null
          curl -fsS http://127.0.0.1:8080/playlist >/dev/null
          curl -fsS http://127.0.0.1:8080/plugin/clock >/dev/null
          curl -fsS http://127.0.0.1:8080/api/health/system >/dev/null
          curl -fsS http://127.0.0.1:8080/api/health/plugins >/dev/null
          curl -fsS http://127.0.0.1:8080/api/benchmarks/summary >/dev/null
          # POST with CSRF token
          COOKIES=$(mktemp)
          curl -fsS -c "$COOKIES" http://127.0.0.1:8080/ -o /tmp/home.html
          CSRF_TOKEN=$(sed -n 's/.*csrf-token.*content="\([^"]*\)".*/\1/p' /tmp/home.html | head -1)
          curl -fsS -b "$COOKIES" -X POST -H "X-CSRFToken: $CSRF_TOKEN" -d 'plugin_id=clock' http://127.0.0.1:8080/save_plugin_settings >/dev/null
          rm -f "$COOKIES"
          kill $PID 2>/dev/null || true

  # Required on every event. Linux only: the Pi runs Linux, and the macOS
  # leg waited hours for a hosted runner often enough to block PRs. It now
  # runs weekly in its own workflow (preflash-macos-weekly.yml).
  preflash-validate:
    name: Pre-flash validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs into .venv, which scripts/preflash_validate.sh requires.
      - uses: ./.github/actions/setup-python-deps
        with:
          os-packages: 'true'
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run pre-flash validation
        env:
          INKYPI_VALIDATE_INSTALL: '1'
          INKYPI_VALIDATE_PI_RUNTIME: '1'
          INKYPI_VALIDATE_STRESS: '1'
          INKYPI_VALIDATE_HEAVY_PLUGINS: '1'
          INKYPI_VALIDATE_BENCH_THRESHOLDS: '1'
          INKYPI_VALIDATE_COLD_BOOT: '1'
          INKYPI_VALIDATE_CACHE: '1'
          INKYPI_VALIDATE_ISOLATION: '1'
          INKYPI_VALIDATE_BROWSER_RENDER: '1'
          INKYPI_VALIDATE_INSTALL_IDEMPOTENCY: '1'
          INKYPI_VALIDATE_FAULTS: '1'
          INKYPI_VALIDATE_UPGRADE_COMPAT: '1'
          INKYPI_VALIDATE_FS_PERMS: '1'
          INKYPI_VALIDATE_RECOVERY: '1'
          INKYPI_VALIDATE_API_CONTRACT: '1'
        run: |
          scripts/preflash_validate.sh

  coverage-gate:
    name: Coverage gate
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One install, into the .venv scripts/preflash_validate.sh requires.
      - uses: ./.github/actions/setup-python-deps
      # Per-module floors are measured against the full suite, not the
      # preflash subset below (which keeps its own lower floors).
      - name: Download full-suite coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-3.13
          path: full-coverage
      - name: Gate critical modules on full-suite coverage
        run: python scripts/coverage_gate.py --profile full full-coverage/coverage.xml
      - name: Run coverage validation
        env:
          INKYPI_VALIDATE_COVERAGE: '1'
        run: |
          scripts/preflash_validate.sh
      - name: Upload coverage gate artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-gate
          path: coverage.xml
          if-no-files-found: error

  security:
    name: Security and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-deps
      - name: Run pip-audit against hashed lockfiles
        run: |
          mkdir -p artifacts/security
          python -m pip_audit -r install/requirements.txt --format=json \
            --output artifacts/security/pip-audit-runtime.json
          python -m pip_audit -r install/requirements-dev.txt --format=json \
            --output artifacts/security/pip-audit-dev.json
      - name: Generate SBOM
        run: |
          python_path="$(python -c 'import sys; print(sys.executable)')"
          python -m cyclonedx_py environment "$python_path" --of JSON \
            -o artifacts/security/sbom.json
      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-artifacts
          path: artifacts/security
          if-no-files-found: error

  flake-detection:
    name: Flake detection
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One install, into the .venv scripts/preflash_validate.sh requires.
      - uses: ./.github/actions/setup-python-deps
        with:
          os-packages: 'true'
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run flake detection
        env:
          INKYPI_VALIDATE_FLAKE: '1'
        run: |
          scripts/preflash_validate.sh
      - name: Preserve repeated renderer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-repeat-diagnostics
          path: |
            artifacts/render-*.log
            artifacts/render-environment.txt
            tests/snapshots/actual/
            tests/snapshots/layout/actual/
          if-no-files-found: warn

  soak-nightly:
    name: Soak nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One install, into the .venv scripts/preflash_validate.sh requires
      # (without it the job fails at once with "FAIL venv .venv is required").
      - uses: ./.github/actions/setup-python-deps
      - name: Run soak validation
        env:
          INKYPI_VALIDATE_SOAK: '1'
        run: |
          scripts/preflash_validate.sh

  # Mutation nightly — runs via the workflow-level ``schedule:`` trigger
  # (daily 09:00 UTC) and manual ``workflow_dispatch`` for ad-hoc artifact
  # collection. Sharded by package so each shard fits in the 120-minute
  # budget. See docs/mutation_testing.md.
  mutation-nightly:
    name: Mutation nightly (${{ matrix.label }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: app-setup
            mutants: app_setup.*
          - label: blueprints
            mutants: blueprints.*
          - label: utils
            mutants: utils.*
          - label: refresh-task
            mutants: refresh_task.*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-deps
        with:
          os-packages: 'true'
      # No asset build, as in the `tests` job: main.css is committed (and
      # tests/unit/test_main_css_current.py checks it), and bundled JS from
      # scripts/build_assets.py is deliberately absent because
      # tests/static/test_debug_console.py asserts the unbundled <script> tags.
      - name: Run mutmut
        env:
          INKYPI_ENV: dev
          INKYPI_NO_REFRESH: '1'
          SKIP_BROWSER: '1'
          MUTANTS: ${{ matrix.mutants }}
        run: |
          # The larger shards cannot finish every mutant inside the job's
          # 120-minute cap, so GitHub used to cancel them and the nightly was
          # red even when nothing was wrong. Stop mutmut at a fixed budget,
          # keep the partial results (uploaded below), and only fail the job
          # when mutmut itself fails, e.g. its clean-test run breaks.
          set +e
          timeout --signal=INT --kill-after=5m 100m \
            mutmut run --max-children 2 "$MUTANTS"
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::notice title=Mutation budget reached::${MUTANTS} stopped after 100 minutes; results are partial."
            exit 0
          fi
          exit "$rc"
      # Report the score on the run page, and keep only mutmut's own result
      # files. Uploading the whole mutants/ tree (a ~100 MB copy of the repo
      # that tests write into) failed the nightly when a file vanished while
      # it was being zipped. The summary never fails the job: mutmut's exit
      # status above already decides that.
      - name: Summarise mutation results
        if: always()
        env:
          LABEL: ${{ matrix.label }}
        run: |
          mkdir -p mutation-report
          mutmut results > mutation-report/results.txt 2>&1 || true
          mutmut export-cicd-stats || true
          if [ -f mutants/mutmut-cicd-stats.json ]; then
            cp mutants/mutmut-cicd-stats.json mutation-report/
          fi
          python scripts/mutation_summary.py \
            mutation-report/mutmut-cicd-stats.json "$LABEL" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Surviving and unchecked mutants: $(wc -l < mutation-report/results.txt)"
      - name: Upload mutation results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-results-${{ matrix.label }}
          # Results plus the mutated copies of the four mutated packages, so
          # `mutmut results` / `mutmut show <id>` work after extracting the
          # artifact into a checkout (see docs/mutation_testing.md).
          path: |
            mutation-report/
            mutants/**/*.meta
            mutants/src/app_setup/**/*.py
            mutants/src/blueprints/**/*.py
            mutants/src/utils/**/*.py
            mutants/src/refresh_task/**/*.py
          if-no-files-found: ignore

  browser-smoke:
    name: Browser smoke (tabs + plugins)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-deps
        with:
          os-packages: 'true'
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium
      - name: Allow the test browser to create its sandbox namespaces
        run: |
          # Ubuntu restricts user namespaces for downloaded Chromium binaries.
          # Permit only this exact test binary; keep Chromium sandboxing enabled.
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] &&
             [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == "1" ]]; then
            python - <<'PYPROFILE' > /tmp/inkypi-headless-shell.apparmor
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              executable = Path(p.chromium.executable_path)
          cache = executable.parents[2]
          revision = executable.parents[1].name.removeprefix("chromium-")
          binaries = list(cache.glob(f"chromium_headless_shell-{revision}/**/headless_shell"))
          binaries += list(cache.glob(f"chromium_headless_shell-{revision}/**/chrome-headless-shell"))
          assert len(binaries) == 1, binaries
          print('abi <abi/4.0>,')
          print('include <tunables/global>')
          print(f'profile inkypi-headless-shell "{binaries[0]}" flags=(unconfined) {{')
          print('  userns,')
          print('}')
          PYPROFILE
            sudo apparmor_parser -r /tmp/inkypi-headless-shell.apparmor
          fi
      - name: Run browser smoke suite
        env:
          BROWSER_SMOKE_ARTIFACT_DIR: runtime/mock_display_output/browser_smoke_failures
          INKYPI_ENV: dev
          INKYPI_NO_REFRESH: '1'
          PYTHONPATH: src
          REQUIRE_BROWSER_SMOKE: '1'
        run: |
          # tests/snapshots/ also runs here because plugin golden-file tests
          # need Playwright Chromium to render real HTML (not the blank fallback).
          # tests/integration/test_visual_regression.py (JTN-700) runs here
          # too because page-layout baselines are gated on the same browser
          # env and share the ubuntu-24.04 font fallback.
          pytest \
            tests/integration/test_browser_smoke.py \
            tests/integration/test_remote_browser_boundary.py \
            tests/integration/test_shared_asset_modal_contracts.py \
            tests/integration/test_visual_regression.py \
            tests/snapshots/ \
            -q
      - name: Upload browser smoke artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-failures
          path: runtime/mock_display_output/browser_smoke_failures
          if-no-files-found: ignore
      - name: Upload snapshot failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-failures
          path: tests/snapshots/actual/
          if-no-files-found: ignore
      - name: Upload layout snapshot failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layout-snapshot-failures
          path: tests/snapshots/layout/actual/
          if-no-files-found: ignore

  browser-full:
    # Every UI / a11y / journey browser suite: the `browser` marker is applied
    # by tests/conftest.py from UI_BROWSER_TESTS + A11Y_BROWSER_TESTS, plus
    # `-m journey`. Before this job they only ran on developer machines with
    # Chromium installed; in CI they silently dropped out of collection.
    # REQUIRE_BROWSER_SMOKE=1 (and CI=true) make a missing Chromium a hard
    # collection error instead of a skip. Files already covered by
    # browser-smoke are deselected so they do not run twice.
    # Sharded round-robin via INKYPI_TEST_SHARD (tests/conftest.py): ~280
    # tests took ~11 min on 4 local xdist workers, so 2 shards keep each
    # comfortably inside the timeout.
    name: Browser full (UI + a11y + journeys, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-deps
        with:
          os-packages: 'true'
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium
      - name: Allow the test browser to create its sandbox namespaces
        run: |
          # Same AppArmor allowance as browser-smoke: permit only this exact
          # test binary to create user namespaces; Chromium sandbox stays on.
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] &&
             [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == "1" ]]; then
            python - <<'PYPROFILE' > /tmp/inkypi-headless-shell.apparmor
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              executable = Path(p.chromium.executable_path)
          cache = executable.parents[2]
          revision = executable.parents[1].name.removeprefix("chromium-")
          binaries = list(cache.glob(f"chromium_headless_shell-{revision}/**/headless_shell"))
          binaries += list(cache.glob(f"chromium_headless_shell-{revision}/**/chrome-headless-shell"))
          assert len(binaries) == 1, binaries
          print('abi <abi/4.0>,')
          print('include <tunables/global>')
          print(f'profile inkypi-headless-shell "{binaries[0]}" flags=(unconfined) {{')
          print('  userns,')
          print('}')
          PYPROFILE
            sudo apparmor_parser -r /tmp/inkypi-headless-shell.apparmor
          fi
      - name: Run browser suites (shard ${{ matrix.shard }}/2)
        env:
          INKYPI_ENV: dev
          INKYPI_NO_REFRESH: '1'
          INKYPI_TEST_SHARD: ${{ matrix.shard }}/2
          PYTHONPATH: src
          REQUIRE_BROWSER_SMOKE: '1'
          # The two-minute sustained-load loop (test_sustained_load.py) runs
          # on the nightly schedule only; on PRs it stays skipped.
          SKIP_LOAD: ${{ github.event_name == 'schedule' && '0' || '1' }}
        run: |
          # xdist is safe here: every browser test boots its own live server
          # on a free port and its own Chromium instance (verified locally
          # with -n 4 and -n 8).
          pytest tests/integration \
            -m "browser or journey" \
            --deselect tests/integration/test_browser_smoke.py \
            --deselect tests/integration/test_shared_asset_modal_contracts.py \
            -n auto -q -rfEsR

  install-matrix:
    # Keep the required install matrix in a reusable workflow so ci.yml and any
    # manual reruns share one implementation instead of drifting apart.
    name: Install matrix
    uses: ./.github/workflows/install-matrix.yml

  install-smoke-memcap:
    name: Install smoke (512 MB memory cap)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run 512 MB memory-cap smoke test
        run: |
          ./scripts/test_install_memcap.sh trixie

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-smoke-memcap-logs
          path: /tmp/inkypi-smoke-logs
          if-no-files-found: ignore

  install-crash-loop-gate:
    name: Systemd container gates
    # JTN-614: runs the JTN-609 Docker-based regression gate that verifies
    # JTN-600 (systemctl disable during install) and JTN-607 (install-in-progress
    # lockfile) both prevent a mid-install crash from spawning a restart loop
    # that would OOM a Pi Zero 2 W. The test auto-skips without Docker, so we
    # set REQUIRE_INSTALL_CRASH_LOOP_TEST=1 to force it on CI.
    #
    # Now runs every `container`-marked test, which also covers
    # test_boot_health_under_systemd.py (OnFailure= -> boot-health.sh ->
    # rollback). The `tests` job excludes them (`-m "not container"`): they
    # boot systemd in Docker, and running them there pushed that job past
    # its 20-minute cap.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python-deps
      - name: Run systemd container gates
        env:
          REQUIRE_INSTALL_CRASH_LOOP_TEST: '1'
          PYTHONPATH: src
          # `-m container` collects the whole tree; no Chromium here, so
          # deselect the browser suites explicitly (see tests/conftest.py).
          SKIP_BROWSER: '1'
        run: |
          pytest -m container -v

  ci-gate:
    name: CI gate (all checks pass)
    needs: [lint, lockfile-drift, tests, sonarcloud, smoke, smoke-refresh, coverage-gate, security, browser-smoke, browser-full, install-smoke-memcap, install-matrix, install-crash-loop-gate, preflash-validate, flake-detection, soak-nightly, mutation-nightly]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      - name: Check all required jobs passed
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # Fail this job (and therefore the gate) if any required job did not succeed.
          # 'sonarcloud' is advisory (secrets may be absent on forks); its result
          # is reported separately rather than required to succeed here.
          results="$RESULTS"
          echo "$results"
          job_result() {
            echo "$results" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get(sys.argv[1],{}).get('result','missing'))" "$1"
          }
          failed=0

          # Jobs that run on every event and must be 'success'
          for job in lint lockfile-drift tests smoke smoke-refresh coverage-gate security browser-smoke browser-full install-smoke-memcap install-matrix install-crash-loop-gate preflash-validate flake-detection; do
            result=$(job_result "$job")
            if [ "$result" != "success" ]; then
              echo "Required job '$job' did not succeed (result: $result)"
              failed=1
            fi
          done

          # Nightly-only jobs. Their `if:` skips them on pull_request/push, so
          # 'skipped' is expected there; on the schedule (and for mutation on
          # workflow_dispatch) they actually run and must succeed, so the
          # nightly gate reflects them instead of silently ignoring them.
          for job in soak-nightly mutation-nightly; do
            result=$(job_result "$job")
            if [ "$result" = "success" ]; then
              continue
            fi
            if [ "$result" = "skipped" ] && [ "$EVENT_NAME" != "schedule" ]; then
              continue
            fi
            echo "Nightly job '$job' did not succeed on '$EVENT_NAME' (result: $result)"
            failed=1
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          # sonarcloud: advisory — warn on failure but do not block
          sonar_result=$(echo "$results" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sonarcloud',{}).get('result','missing'))")
          if [ "$sonar_result" = "failure" ]; then
            echo "WARNING: sonarcloud reported failure — investigate but not blocking gate"
          fi

          echo "All required CI checks passed."
