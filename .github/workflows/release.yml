name: Release

# Release only a commit CI has passed. A push used to start this workflow
# alongside CI, so a version (and its wheelhouse and Pi image) could ship from
# a commit whose checks then failed.
#
# CI on main cancels its run for a commit as soon as a newer commit lands, so
# during a burst of merges only the last commit's run completes. Its release
# includes every commit since the last tag. To retry after a flaky failure,
# re-run the failed CI jobs: a successful re-run starts this workflow again.
#
# A release stays a draft until every file is attached to it:
#
#   gate -> release -> draft -> sbom, wheelhouse, pi-image -> publish
#
# `release` bumps the version, then commits and tags it on main. `draft`
# creates the GitHub release as a draft. The three asset jobs attach their
# files to the draft, and `publish` publishes it only once all three have
# succeeded. GitHub's immutable releases need that order: once a release is
# published its files and tag can't change. The Pi's update check
# (`/releases/latest`) skips drafts, and a draft's download URLs return 404.
#
# If an asset job fails, the release stays a draft. Re-run the failed jobs:
# uploads replace files of the same name, and `publish` runs once they pass.
# See docs/development.md#releases.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Check that main is the commit CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pull-request and scheduled CI runs complete here too; only a passing
    # run for a push to main may release.
    if: >-
      github.repository == 'jtn0123/InkyPi' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    outputs:
      current: ${{ steps.check.outputs.current }}
    steps:
      - name: Compare main with the tested commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          if [ "${main_sha}" = "${TESTED_SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            # A newer commit landed after this run started (a cancelled run
            # never gets here). Its own CI run releases both commits.
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release deferred::main is now ${main_sha}, not the tested ${TESTED_SHA}; CI on the newer commit will release it."
          fi

  release:
    name: Tag the release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.gate.outputs.current == 'true'
    # The version-bump commit and tag go to main over the release deploy key,
    # the only actor allowed past main's required "CI gate" check. This job's
    # GITHUB_TOKEN can't push, so a push without the key fails rather than
    # going out some other way.
    permissions:
      contents: read
    outputs:
      released: ${{ steps.resolve_tag.outputs.released }}
      tag: ${{ steps.resolve_tag.outputs.tag }}
      notes: ${{ steps.psr.outputs.release_notes }}
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # Check out the branch, not the SHA: semantic-release commits the
      # version bump on top and pushes it, which needs a branch that tracks
      # origin/main. With `ssh-key`, origin is the SSH URL and the key stays
      # configured for semantic-release's push; the post-job step removes it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Confirm main is still the tested commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ "${actual}" != "${TESTED_SHA}" ]; then
            echo "::error title=Release aborted::main moved to ${actual} after the gate checked ${TESTED_SHA}; CI on the newer commit will release it."
            exit 1
          fi

      - name: Confirm the push will use the deploy key
        env:
          HAS_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          origin=$(git remote get-url origin)
          if [ "${HAS_DEPLOY_KEY}" != "true" ] || [[ "${origin}" != git@github.com:* ]]; then
            echo "::error title=No release deploy key::Add the RELEASE_DEPLOY_KEY secret (a deploy key with write access); semantic-release pushes the release commit and tag with it."
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: install/requirements.txt

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"
          enable-cache: true

      # This job pushes the release commit and tag, so the tools and every
      # dependency are installed from the locked `release` group, hash-checked.
      - name: Install semantic-release and SBOM tools
        run: |
          uv export --frozen --only-group release --no-emit-project \
            --format requirements.txt --output-file "$RUNNER_TEMP/release-tools.txt"
          python -m pip install --require-hashes --no-deps \
            -r "$RUNNER_TEMP/release-tools.txt"

      # --no-vcs-release: semantic-release would create the GitHub release
      # already published, and upload VERSION and uv.lock to it. The `draft`
      # job creates it instead. No GH_TOKEN: with `ignore_token_for_push`
      # (pyproject.toml) the push goes over the SSH origin, and nothing else
      # here calls the GitHub API. The release notes come back as the
      # `release_notes` step output.
      - name: Semantic Release — bump, commit, tag and push
        id: psr
        run: semantic-release version --no-vcs-release

      - name: Resolve released tag
        id: resolve_tag
        run: |
          TAG=$(
            git tag --points-at HEAD \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$' \
            | sort -V \
            | tail -n1 \
            || true
          )
          if [ -n "${TAG}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "Release tag: ${TAG}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No new release tag on this run."
          fi

      - name: Warn loudly if no release was cut
        if: steps.resolve_tag.outputs.released != 'true'
        run: |
          # python-semantic-release exits 0 when a merged commit doesn't match
          # a bumpable conventional-commit type (feat/fix/perf or BREAKING
          # CHANGE). A silent green here hid 5 unreleased PRs in a row. Emit
          # a prominent annotation so future misses are visible on the commit
          # status page and in the Actions summary.
          SUBJECT=$(git log -1 --pretty=%s)
          {
            echo "## No release cut"
            echo ""
            echo "\`semantic-release version\` found no bumpable commits since"
            echo "the last tag. Most recent commit subject:"
            echo ""
            echo "    ${SUBJECT}"
            echo ""
            echo "If this merge included user-facing changes, the PR title"
            echo "probably didn't use a conventional-commits type that triggers"
            echo "a bump (\`feat:\`, \`fix:\`, \`perf:\`, or a \`BREAKING CHANGE:\`"
            echo "footer). See CONTRIBUTING.md."
          } >> "$GITHUB_STEP_SUMMARY"
          # GitHub workflow commands require %, CR, and LF in message bodies
          # to be URL-encoded, otherwise subjects like "bump coverage to 90%"
          # render garbled in the annotation.
          ESCAPED=${SUBJECT//%/%25}
          ESCAPED=${ESCAPED//$'\r'/%0D}
          ESCAPED=${ESCAPED//$'\n'/%0A}
          echo "::warning title=No release cut::semantic-release skipped this commit; subject: ${ESCAPED}"
          # Non-failing on purpose — docs/chore/refactor PRs legitimately skip
          # release, so we only surface the info rather than red-crossing the run.

  # Its own job so a failure here can be re-run: re-running `release` would
  # stop at "Confirm main is still the tested commit", because main now has
  # the version-bump commit on top.
  draft:
    name: Create the draft release
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the draft, or refresh its notes on a re-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
          NOTES: ${{ needs.release.outputs.notes }}
        run: |
          set -euo pipefail
          if [ -z "${NOTES}" ]; then
            echo "::error title=No release notes::semantic-release gave no release_notes output for ${TAG}."
            exit 1
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "${NOTES}" > "${notes_file}"

          # gh finds a draft by its tag too. Only "release not found" means
          # there is none yet: GitHub allows several drafts for one tag, so
          # any other error must not lead to creating a second one.
          if is_draft=$(gh release view "${TAG}" --repo "${REPO}" \
                --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/view.err"); then
            if [ "${is_draft}" != "true" ]; then
              echo "::error title=Already published::${TAG} is already published, so its files can no longer change."
              exit 1
            fi
            gh release edit "${TAG}" --repo "${REPO}" \
              --title "${TAG}" --notes-file "${notes_file}"
            echo "Refreshed the notes on draft release ${TAG}"
          elif grep -q "release not found" "$RUNNER_TEMP/view.err"; then
            gh release create "${TAG}" --repo "${REPO}" --draft --verify-tag \
              --title "${TAG}" --notes-file "${notes_file}"
            echo "Created draft release ${TAG}"
          else
            cat "$RUNNER_TEMP/view.err" >&2
            exit 1
          fi

  sbom:
    name: Attach the SBOM
    needs: [release, draft]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: install/requirements.txt

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"
          enable-cache: true

      # This job uploads to the release, so its tools come from the same
      # locked, hash-checked `release` group.
      - name: Install the SBOM tools
        run: |
          uv export --frozen --only-group release --no-emit-project \
            --format requirements.txt --output-file "$RUNNER_TEMP/release-tools.txt"
          python -m pip install --require-hashes --no-deps \
            -r "$RUNNER_TEMP/release-tools.txt"

      - name: Generate SBOM
        run: |
          pip install -r install/requirements.txt
          python -m venv .venv
          .venv/bin/pip install -r install/requirements.txt
          mkdir -p artifacts/security
          python -m cyclonedx_py environment .venv/bin/python --of JSON \
            -o artifacts/security/sbom.json

      - name: Attach SBOM to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          SBOM_FILE="inkypi-${TAG}-bom.json"
          cp artifacts/security/sbom.json "${SBOM_FILE}"
          is_draft=$(gh release view "${TAG}" --repo "${REPO}" --json isDraft --jq .isDraft)
          if [ "${is_draft}" != "true" ]; then
            echo "::error title=SBOM not attached::${TAG} is not a draft; a published release can't take new files."
            exit 1
          fi
          # --clobber replaces a file of the same name, so a re-run is safe.
          gh release upload "${TAG}" "${SBOM_FILE}" --repo "${REPO}" --clobber
          echo "Attached ${SBOM_FILE} to draft release ${TAG}"

  wheelhouse:
    name: Build wheelhouse release assets
    needs: [release, draft]
    permissions:
      contents: write
    uses: ./.github/workflows/build-wheelhouse.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  pi-image:
    name: Build pre-installed Pi image
    needs: [release, draft]
    # The reusable verifier reads Actions artifacts, including manual rechecks.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/build-pi-image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  # Runs only once every asset job has succeeded. A failed or skipped one
  # leaves the release a draft; re-running the failed jobs brings this job
  # back with them.
  publish:
    name: Publish the release
    needs: [release, draft, sbom, wheelhouse, pi-image]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      # Last check before the files are fixed for good.
      - name: Check every file is on the draft
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          expected=(
            "inkypi-${TAG}-bom.json"
            "inkypi-wheels-${VERSION}-linux_armv7l.tar.gz"
            "inkypi-wheels-${VERSION}-linux_armv7l.tar.gz.sha256"
            "inkypi-wheels-${VERSION}-linux_armv7l.tar.gz.manifest.sha256"
            "inkypi-wheels-${VERSION}-linux_aarch64.tar.gz"
            "inkypi-wheels-${VERSION}-linux_aarch64.tar.gz.sha256"
            "inkypi-wheels-${VERSION}-linux_aarch64.tar.gz.manifest.sha256"
            "inkypi-${VERSION}-pi-zero-2-w.img.xz"
            "inkypi-${VERSION}-pi-zero-2-w.img.xz.sha256"
            "inkypi-${VERSION}-os-list.json"
          )
          attached=$(gh release view "${TAG}" --repo "${REPO}" --json assets \
            --jq '.assets[] | select(.state == "uploaded") | .name')
          missing=()
          for name in "${expected[@]}"; do
            grep -Fxq -- "${name}" <<< "${attached}" || missing+=("${name}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Release incomplete::${TAG} is missing: ${missing[*]}"
            exit 1
          fi
          echo "All ${#expected[@]} files are attached to ${TAG}"

      - name: Publish the draft
        run: |
          set -euo pipefail
          is_draft=$(gh release view "${TAG}" --repo "${REPO}" --json isDraft --jq .isDraft)
          if [ "${is_draft}" != "true" ]; then
            echo "::notice title=Already published::${TAG} was already published."
            exit 0
          fi
          # Mark it latest, unless a higher version is already published: two
          # release runs can overlap, and the older one may finish last.
          latest=$(gh api "repos/${REPO}/releases/latest" --jq .tag_name 2>/dev/null || true)
          make_latest=true
          if [ -n "${latest}" ] && \
             [ "$(printf '%s\n%s\n' "${latest}" "${TAG}" | sort -V | tail -n1)" != "${TAG}" ]; then
            make_latest=false
            echo "::notice title=Not marked latest::${latest} is newer and stays the latest release."
          fi
          gh release edit "${TAG}" --repo "${REPO}" --draft=false --latest="${make_latest}"
          echo "Published ${TAG} (latest: ${make_latest})"
