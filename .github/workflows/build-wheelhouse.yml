name: Build release wheelhouse

# JTN-604: Build pre-compiled wheels for Pi Zero 2 W (armv7) and Pi 4/5 (arm64)
# and attach them as release assets. install.sh prefers the bundle when
# available, dropping first-boot install time on a Pi Zero 2 W from ~15 min
# down to ~2-3 min (no on-device wheel compilation for numpy/Pillow/cffi/etc).
#
# release.yml calls this workflow (JTN-745) while the release is still a
# draft, and publishes the release only after this succeeds, so a failed
# build fails the Release run and leaves the release unpublished. Files are
# attached only to a draft: once published, an immutable release's files
# can't change. That is also why there is no `release: published` trigger.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build wheels for (e.g. v0.28.1)
        required: true
        type: string
  # Manual recheck: rebuild the wheels for an existing tag. They are attached
  # only if that release is still a draft (for example, one whose Release run
  # failed); for a published release they stay in this run's artifacts.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build wheels for (e.g. v0.28.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-wheelhouse-${{ inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux_armv7l
            docker_platform: linux/arm/v7
          - arch: linux_aarch64
            docker_platform: linux/arm64
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            echo "ERROR: No release tag resolved" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: ${{ matrix.docker_platform }}

      - name: Build wheels in Trixie container
        env:
          PLATFORM: ${{ matrix.docker_platform }}
          ARCH: ${{ matrix.arch }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/wheels

          # Trixie container matches the Pi OS 13 target; python3.13 is the
          # default interpreter. Mirrors the runtime the wheels will be
          # installed onto so wheel tags line up exactly with what pip sees
          # during install on-device.
          # Pinned by the multi-arch index digest, so a re-tagged image can't
          # change what builds the release wheels. Dependabot doesn't see
          # `docker run`; refresh with
          #   docker buildx imagetools inspect debian:trixie-slim
          docker run --rm \
            --platform "$PLATFORM" \
            -v "$PWD:/src" \
            -w /src \
            debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 \
            bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                python3 python3-venv python3-pip python3-dev \
                build-essential pkg-config \
                libtiff-dev libopenjp2-7-dev libfreetype6-dev \
                libopenblas-dev libjpeg-dev zlib1g-dev \
                libffi-dev libssl-dev libxml2-dev libxslt1-dev \
                libsystemd-dev libheif-dev \
                libcairo2-dev libgirepository1.0-dev \
                swig ca-certificates
              python3 -m venv /tmp/buildvenv
              . /tmp/buildvenv/bin/activate
              # pip, setuptools and wheel at the hashed installer pins.
              python3 -m pip install --require-hashes \
                -r /src/install/bootstrap-requirements.txt
              # Build wheels for every dep in the locked requirements file.
              # --no-deps is intentional: pip wheel already walks the
              # dependency graph from the requirements file, and we do not
              # want to pull in extras.
              python3 -m pip wheel \
                --wheel-dir=/src/dist/wheels \
                -r /src/install/requirements.txt
            '

          # `|| true` swallows SIGPIPE from `head` closing the pipe once it
          # has enough lines — under `set -o pipefail`, the resulting exit
          # code propagates and fails an otherwise-successful wheel build
          # (v1.0.0 wheelhouse run failed this way after the wheel count
          # grew past head's cutoff). This is diagnostic output only.
          find dist/wheels -maxdepth 1 -type f -print | head -40 || true
          echo "Wheel count: $(find dist/wheels -name '*.whl' | wc -l)"

      - name: Package wheelhouse tarball
        id: package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          TARBALL="inkypi-wheels-${VERSION}-${ARCH}.tar.gz"
          tar -czf "$TARBALL" -C dist/wheels .
          sha256sum "$TARBALL" > "${TARBALL}.sha256"
          # JTN-697: Per-wheel sha256 manifest so install.sh can detect a
          # truncated/corrupt individual wheel inside an otherwise-valid
          # tarball (e.g. 0-byte numpy-*.whl). Format: one `sha256sum` line
          # per wheel with basenames only, so verification can `cd` into the
          # extracted wheelhouse dir and run `sha256sum -c` directly.
          ( cd dist/wheels && sha256sum -- *.whl ) > "${TARBALL}.manifest.sha256"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          ls -la "$TARBALL" "${TARBALL}.sha256" "${TARBALL}.manifest.sha256"

      - name: Keep the wheelhouse as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.tarball }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
            ${{ steps.package.outputs.tarball }}.manifest.sha256
          if-no-files-found: error
          retention-days: 7
          # A re-run of a failed job uploads it again.
          overwrite: true

      # gh, not softprops/action-gh-release: that action publishes a draft
      # once it has uploaded to it, unless told `draft: true`. --clobber
      # replaces files of the same name, so a re-run is safe.
      - name: Attach wheelhouse to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          is_draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft) \
            || is_draft="no release"
          if [ "$is_draft" = "true" ]; then
            gh release upload "$TAG" --repo "$REPO" --clobber \
              "$TARBALL" "${TARBALL}.sha256" "${TARBALL}.manifest.sha256"
            echo "Attached ${TARBALL} to draft release ${TAG}"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::notice title=Wheelhouse not attached::${TAG} is not a draft release, so the wheels stay in this run's artifacts."
          else
            echo "::error title=Wheelhouse not attached::${TAG} is not a draft release; a published release can't take new files."
            exit 1
          fi
