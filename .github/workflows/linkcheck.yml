name: Docs link check

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/check_links.py'
      - '.github/workflows/linkcheck.yml'
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the verified link checker
        run: |
          case "$(uname -m)" in
            aarch64) tool_arch=aarch64 ;;
            x86_64) tool_arch=x86_64 ;;
            *) exit 1 ;;
          esac
          tool_target="${tool_arch}-unknown-linux-gnu"
          tool_asset="lychee-${tool_target}.tar.gz"
          tool_dir="${RUNNER_TEMP}/inkypi-lychee"
          mkdir -p "${tool_dir}/bin"
          cd "${tool_dir}"
          release_url='https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2'
          curl --fail --silent --show-error --location --max-time 60 \
            "${release_url}/${tool_asset}" --output "${tool_asset}"
          curl --fail --silent --show-error --location --max-time 30 \
            "${release_url}/${tool_asset}.sha256" --output "${tool_asset}.sha256"
          sha256sum --check "${tool_asset}.sha256"
          tar -xzf "${tool_asset}"
          install -m 755 "lychee-${tool_target}/lychee" "${tool_dir}/bin/lychee"
          printf '%s\n' "${tool_dir}/bin" >> "${GITHUB_PATH}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: install/requirements-dev.txt

      - name: Install locked browser verifier
        run: |
          python -m pip install --require-hashes -r install/requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Check links with lychee
        run: |
          shopt -s globstar nullglob
          document_inputs=(README.md docs/**/*.md)
          lychee --version
          # Recheck HTTP client rejection with actual browser navigation.
          # Every URL still requires valid TLS and a real HTTP 2xx document.
          python3 scripts/check_links.py \
            --browser-verify \
            --cookie-jar "${RUNNER_TEMP}/lychee-cookies.json" \
            --report "${RUNNER_TEMP}/inkypi-links.json" \
            "${document_inputs[@]}"
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Publish link report
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/inkypi-links.json" ]]; then
            {
              printf '```json\n'
              cat "${RUNNER_TEMP}/inkypi-links.json"
              printf '\n```\n'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
