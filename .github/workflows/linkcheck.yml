name: Docs link check

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    # The GNU build loops through Shopify redirects where same-runner curl
    # succeeds. The native Darwin release validates the same URLs normally.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the verified native link checker
        run: |
          case "$(uname -m)" in
            arm64) tool_arch=aarch64 ;;
            x86_64) tool_arch=x86_64 ;;
            *) exit 1 ;;
          esac
          tool_target="${tool_arch}-apple-darwin"
          tool_asset="lychee-${tool_target}.tar.gz"
          tool_dir="${RUNNER_TEMP}/inkypi-lychee"
          mkdir -p "${tool_dir}/bin"
          cd "${tool_dir}"
          release_url='https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2'
          curl --fail --silent --show-error --location --max-time 60 \
            "${release_url}/${tool_asset}" --output "${tool_asset}"
          curl --fail --silent --show-error --location --max-time 30 \
            "${release_url}/${tool_asset}.sha256" --output "${tool_asset}.sha256"
          shasum --algorithm 256 --check "${tool_asset}.sha256"
          tar -xzf "${tool_asset}"
          install -m 755 "lychee-${tool_target}/lychee" "${tool_dir}/bin/lychee"
          printf '%s\n' "${tool_dir}/bin" >> "${GITHUB_PATH}"

      - name: Check links with lychee
        run: |
          # Vendor storefronts rate-limit request bursts. Keep failures visible,
          # but check fewer links at once and allow transient services to recover.
          # Preserve session cookies through storefront redirects in this job only.
          lychee --no-progress --verbose --max-concurrency 4 --retry-wait-time 5 \
            --cookie-jar "${RUNNER_TEMP}/lychee-cookies.json" \
            --format markdown --output "${RUNNER_TEMP}/inkypi-links.md" \
            README.md docs/**/*.md
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Publish link report
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/inkypi-links.md" ]]; then
            cat "${RUNNER_TEMP}/inkypi-links.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
