name: Docs link check

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the verified link checker
        run: |
          case "$(uname -m)" in
            aarch64) tool_arch=aarch64 ;;
            x86_64) tool_arch=x86_64 ;;
            *) exit 1 ;;
          esac
          tool_target="${tool_arch}-unknown-linux-gnu"
          tool_asset="lychee-${tool_target}.tar.gz"
          tool_dir="${RUNNER_TEMP}/inkypi-lychee"
          mkdir -p "${tool_dir}/bin"
          cd "${tool_dir}"
          release_url='https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2'
          curl --fail --silent --show-error --location --max-time 60 \
            "${release_url}/${tool_asset}" --output "${tool_asset}"
          curl --fail --silent --show-error --location --max-time 30 \
            "${release_url}/${tool_asset}.sha256" --output "${tool_asset}.sha256"
          sha256sum --check "${tool_asset}.sha256"
          tar -xzf "${tool_asset}"
          install -m 755 "lychee-${tool_target}/lychee" "${tool_dir}/bin/lychee"
          printf '%s\n' "${tool_dir}/bin" >> "${GITHUB_PATH}"

      - name: Check links with lychee
        run: |
          lychee --version
          # Some storefronts reject Lychee while same-runner curl GET succeeds.
          # Independently recheck 429s; every URL still requires a real success.
          python3 scripts/check_links.py \
            --cookie-jar "${RUNNER_TEMP}/lychee-cookies.json" \
            --report "${RUNNER_TEMP}/inkypi-links.json" \
            README.md docs/**/*.md
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Publish link report
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/inkypi-links.json" ]]; then
            {
              printf '```json\n'
              cat "${RUNNER_TEMP}/inkypi-links.json"
              printf '\n```\n'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
