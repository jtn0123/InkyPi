name: Docs link check

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Vendor storefronts rate-limit request bursts. Keep failures visible,
          # but check fewer links at once and allow transient services to recover.
          # Preserve session cookies through storefront redirects in this job only.
          args: --no-progress --verbose --max-concurrency 4 --retry-wait-time 5 --cookie-jar /tmp/lychee-cookies.json README.md docs/**/*.md
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Diagnose storefront responses if link validation fails
        if: failure()
        run: |
          # Compare client identity on the same runner. Print status/redirects
          # only; do not print response headers, cookies or the workflow token.
          for client_agent in 'lychee/0.24.2' 'curl/8.4.0'; do
            cookie_file="${RUNNER_TEMP}/storefront-${client_agent//\//-}.json"
            for storefront_url in 'https://collabs.shop/jrzqmf' 'https://collabs.shop/q2jmza'; do
              printf 'client=%s url=%s ' "${client_agent}" "${storefront_url}"
              curl --silent --show-error --location --max-redirs 5 --max-time 25 \
                --user-agent "${client_agent}" \
                --cookie "${cookie_file}" --cookie-jar "${cookie_file}" \
                --output /dev/null \
                --write-out 'status=%{http_code} redirects=%{num_redirects}\n' \
                "${storefront_url}" || true
            done
          done
