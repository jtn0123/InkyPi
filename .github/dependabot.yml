version: 2
updates:
  # Source of truth is pyproject.toml + uv.lock (JTN-616); install/requirements.txt
  # is generated from them by `uv export`. Pointing Dependabot at /install made it
  # edit that generated file, which fails the lockfile drift check by construction
  # and duplicated every security bump across both paths. The uv ecosystem updates
  # pyproject.toml and uv.lock together, keeping `uv lock --check` green. That
  # covers the dev tools too: they are the `dev` dependency group in the same
  # lock. A bump PR still needs the two exports regenerated (the drift check
  # in CI's lint job names the commands).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The composite action in .github/actions/ pins actions too; listing it here
  # keeps those pins moving with the workflow ones.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The dev container's base image, pinned by digest in /Dockerfile. The
  # install-matrix Dockerfiles in scripts/ deliberately float on debian:<codename>.
  # Front-end libraries are checked by .github/workflows/vendor-versions.yml.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
