sonar.projectKey=jtn0123_InkyPi
sonar.organization=jtn0123ismysonar

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/test_*.py,**/tests/**
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/venv/**,**/node_modules/**,**/build/**,**/waveshare_epd/**

# Python coverage (generated by pytest --cov)
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=src/static/scripts/**,src/static/sw.js

# The two browser reporter scripts intentionally share boilerplate
# (rate-limiting, sendBeacon, CSRF token, self-disable). Extracting a
# shared helper would add more complexity than it removes for these
# tiny files — exclude them from duplicate-line detection.
sonar.cpd.exclusions=src/static/scripts/client_error_reporter.js,src/static/scripts/client_log_reporter.js

sonar.python.version=3.13

# The RefreshTask refactor splits task.py into scheduler/housekeeping/health
# collaborators (PR #550). Those collaborators legitimately import the same
# utilities (metrics, time_utils, fallback_image, history_cleanup) that
# task.py used to own; likewise the collaborator tests import the
# collaborators and their downstream helpers. The server-side architecture
# definition predates the refactor and flags these as disallowed edges, so
# we suppress pythonarchitecture:S7788 for the affected files. Quality gate
# already passes; this keeps the "new issues" count at 0.
# Sidebar now-showing work (JTN-715) adds imports from inkypi.py ↔
# utils/display_names ↔ blueprints/main.py that cross the same predeclared
# architectural boundaries as the RefreshTask refactor. The code is new and
# intentional; the Sonar architecture definition still reflects the older
# layering. Suppress pythonarchitecture:S7788 for the affected sources and
# tests so the PR's new-issue count stays at 0. Remove these entries once
# the server-side architecture spec is updated.
#
# JTN-K4 (/update_now TimeoutError -> typed 504) and JTN-S2 (chromium
# pgroup kill on worker timeout) add tests that legitimately import
# plugin_errors / worker / refresh_task.__init__ to exercise the new
# typed responses and the setsid guard. The architecture spec predates
# these tests; suppress S7788 for those specific test files so new-issue
# count stays at 0. Remove once the architecture spec is updated.
sonar.issue.ignore.multicriteria=archRefresh1,archRefresh2,archRefresh3,archSidebar2,archSidebar3,archSidebar4,archSidebar5,archPipeDeadlock1,archPipeDeadlock2,archCrash1,archImage1,archImage2,archImage3,archHttpWeb,archHttpSetup,archHttpCalendar,archHttpComic,archHttpRss
sonar.issue.ignore.multicriteria.archRefresh1.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archRefresh1.resourceKey=src/refresh_task/health.py
sonar.issue.ignore.multicriteria.archRefresh2.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archRefresh2.resourceKey=src/refresh_task/housekeeping.py
sonar.issue.ignore.multicriteria.archRefresh3.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archRefresh3.resourceKey=tests/unit/test_refresh_task_collaborators.py
sonar.issue.ignore.multicriteria.archSidebar2.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archSidebar2.resourceKey=src/inkypi.py
sonar.issue.ignore.multicriteria.archSidebar3.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archSidebar3.resourceKey=tests/unit/test_inkypi_sidebar_helpers.py
sonar.issue.ignore.multicriteria.archSidebar4.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archSidebar4.resourceKey=tests/unit/test_main_refresh_helpers.py
sonar.issue.ignore.multicriteria.archSidebar5.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archSidebar5.resourceKey=tests/integration/test_display_flows.py
sonar.issue.ignore.multicriteria.archPipeDeadlock1.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archPipeDeadlock1.resourceKey=tests/integration/test_update_now_timeout.py
sonar.issue.ignore.multicriteria.archPipeDeadlock2.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archPipeDeadlock2.resourceKey=tests/unit/test_refresh_task_critical.py

#
# PR #632 adds utils/crash_breadcrumb.py (a new module the architecture spec
# has never seen) and routes the image plugins through the shared
# utils/image_utils + utils/image_loader helpers. The sharing is the point:
# each plugin had its own copy of the background-color and fit-mode logic, and
# image_upload's copy had drifted into a real bug (it hardcoded RGB and crashed
# on L/1-mode uploads). Deduplicating them creates edges the predeclared
# layering does not know about. Suppress S7788 for those files; remove once the
# server-side architecture spec is updated.
sonar.issue.ignore.multicriteria.archCrash1.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archCrash1.resourceKey=src/refresh_task/task.py
sonar.issue.ignore.multicriteria.archImage1.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archImage1.resourceKey=src/plugins/image_album/image_album.py
sonar.issue.ignore.multicriteria.archImage2.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archImage2.resourceKey=src/plugins/image_folder/image_folder.py
sonar.issue.ignore.multicriteria.archImage3.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archImage3.resourceKey=src/plugins/image_upload/image_upload.py

# Removing the utils/http_utils.py facade (A2) points every route module,
# app_setup and three plugins at the modules that define the HTTP helpers
# (utils.api_responses, http_transport, safe_fetch). The server-side
# architecture spec still allows the web layer to reach those helpers only
# through the deleted facade. The two patterns cover the whole web and app
# setup layers (and replace the per-file blueprints/main.py and
# blueprints/diagnostics.py entries). Remove all of these once the spec on
# SonarCloud lets the web layer import those three modules directly.
sonar.issue.ignore.multicriteria.archHttpWeb.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archHttpWeb.resourceKey=src/blueprints/**/*.py
sonar.issue.ignore.multicriteria.archHttpSetup.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archHttpSetup.resourceKey=src/app_setup/**/*.py
sonar.issue.ignore.multicriteria.archHttpCalendar.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archHttpCalendar.resourceKey=src/plugins/calendar/calendar.py
sonar.issue.ignore.multicriteria.archHttpComic.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archHttpComic.resourceKey=src/plugins/comic/comic_parser.py
sonar.issue.ignore.multicriteria.archHttpRss.ruleKey=pythonarchitecture:S7788
sonar.issue.ignore.multicriteria.archHttpRss.resourceKey=src/plugins/rss/rss.py

# Fail CI when quality gate is not met (e.g. new issues introduced)
sonar.qualitygate.wait=true
