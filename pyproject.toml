[project]
name = "inkypi"
version = "1.9.0"
description = "InkyPi — e-ink dashboard for Raspberry Pi"
requires-python = ">=3.13,<3.14"
# Runtime dependencies. The source of truth is this pyproject.toml + uv.lock;
# install/requirements.txt is exported from uv.lock via `uv export` (JTN-616).
dependencies = [
  "flask>=3.1,<4",
  "python-dotenv>=1.2,<2",
  "inky>=2.5,<3; sys_platform == 'linux'",
  "requests>=2.34,<3",
  "urllib3>=2.8,<3",
  "werkzeug>=3.1,<4",
  "pillow>=13.0,<14",
  "pi-heif==1.4.0",
  "tzdata>=2026.1",
  "openai>=3.22,<4",
  "google-genai>=3.3,<4",
  "numpy>=2.5,<3",
  "icalendar>=7.3,<8",
  "recurring-ical-events>=3.8,<4",
  "psutil>=7.2,<8",
  "cysystemd>=2.0,<3; sys_platform == 'linux'",
  "waitress>=3.0,<4",
  "feedparser>=6.0,<7",
  "jsonschema>=4.26,<5",
  "astral>=3.2,<4",
  "prometheus-client>=0.26,<1",
]

[dependency-groups]
# Dev, test and CI tools. They are locked in uv.lock with the runtime
# dependencies, so Dependabot's uv updates cover them too, and
# install/requirements-dev.txt is exported from the lock (runtime + dev):
#   uv export --format requirements.txt --group dev --no-emit-project \
#     --output-file install/requirements-dev.txt
# scripts/check_requirements_drift.sh fails CI when the export is stale.
dev = [
  "uv==0.13.4",
  # Testing
  "pytest>=9.1,<10",
  "pytest-xdist>=3.8,<4",
  "pytest-cov>=7.1,<8",
  "pytest-benchmark>=5.3,<6",
  # Flakiness retry for integration tests only (tests/integration/conftest.py);
  # unit tests must not retry. 16.x is the first release supporting pytest 9.
  "pytest-rerunfailures>=16.7,<17",
  # Per-test hang protection (pytest.ini `timeout`).
  "pytest-timeout>=2.4,<3",
  "requests-mock>=1.12,<2",
  "freezegun>=1.5,<2",
  "hypothesis>=6.168,<7",
  # Type checking. Without types-PyYAML mypy aborts the whole tests/ run, so
  # the stubs are required, not a nicety. The runtime-library stubs match the
  # versions in [project.dependencies]; mypy.ini lists the imports that have
  # no types anywhere.
  "mypy>=2.3,<3",
  "types-PyYAML==6.0.12.20260906",
  "types-requests==2.33.0.20260906",
  "types-jsonschema==4.26.0.20261006",
  "types-psutil==7.2.2.20261111",
  "types-waitress==3.0.1.20260724",
  # Linting / formatting
  "black>=26.0,<27",
  "ruff>=0.16,<1",
  # `watchmedo` for scripts/dev_watch.sh. 7.x matches watch patterns against
  # the full path, which dev_watch.sh's **/ patterns rely on.
  "watchdog>=7.1,<8",
  # Browser / E2E testing. Playwright ships no 32-bit ARM builds; the marker
  # keeps the Pi entries in required-environments resolvable.
  "playwright>=1.63,<2; platform_machine != 'armv6l' and platform_machine != 'armv7l'",
  # Safe XML parsing in tests and scripts.
  "defusedxml>=0.7,<1",
  # Audit / compliance
  "pip-audit>=2.10,<3",
  "cyclonedx-bom>=8.0,<9",
  "pre-commit>=4.6,<5",
  # Matches the pin in .github/workflows/release.yml.
  "python-semantic-release==10.7.0",
  # Patched floor for python-semantic-release's GitPython.
  "GitPython>=3.1.59,<4",
  "pip-licenses>=5.5,<6",
  # Mutation testing (optional, slow: `mutmut run`).
  "mutmut>=3.8,<4",
  # Memory profiling for the per-PR memory diff (Linux wheels only;
  # tracemalloc is the fallback elsewhere).
  "memray>=1.20,<2; sys_platform == 'linux'",
]

[tool.uv]
# uv needs to know we support Linux (Pi) + macOS (dev) + arm64/aarch64/armhf wheels.
# A universal resolution covers all supported platforms in a single lockfile.
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'linux' and platform_machine == 'armv7l'",
  "sys_platform == 'linux' and platform_machine == 'armv6l'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.setuptools]
# We only use pyproject.toml for dependency metadata; no packages are published.
packages = []

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = """
(
  mock_display_output
)
"""

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests", "scripts"]
exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "mock_display_output",
  "src/display/waveshare_epd",
  "clients"
]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle
  "F",      # pyflakes
  "I",      # isort (imports)
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "C4",     # flake8-comprehensions
  "PERF",   # perflint
  "PIE",    # flake8-pie
  "RSE",    # flake8-raise
  "DTZ",    # flake8-datetimez
  "RET",    # flake8-return
  "RUF100", # unused or unknown noqa codes
]
ignore = [
  "E501",   # line length handled by Black
  "B011",   # assert False (used as sentinel in tests)
  "B017",   # pytest.raises(Exception) is acceptable
  "SIM105", # contextlib.suppress — noisy, debatable
  "SIM117", # multiple with statements — stylistic
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally construct naive datetimes for fixture-style assertions and
# deterministic clock stubs. Mirroring production's tz-aware datetime everywhere
# would bloat the suite without exercising new behavior. We still enforce
# timezone-awareness for clock-based calls (now/fromtimestamp/date.today) in
# tests because those drift with host locale and can hide real bugs.
"tests/**" = ["DTZ001", "DTZ002", "DTZ003", "DTZ007"]


[tool.mutmut]
# Copy the full source tree so imports and runtime assets remain available,
# while preserving the original four-package mutation scope.
source_paths = ["src/"]
only_mutate = [
  "src/app_setup/*",
  "src/blueprints/*",
  "src/utils/*",
  "src/refresh_task/*",
]
pytest_add_cli_args = ["-x", "--tb=no", "-q", "-m", "not container"]
pytest_add_cli_args_test_selection = ["tests/"]
# The suite checks repository configuration and runs helper scripts from the
# isolated mutants/ tree, so copy those inputs alongside the tests and source.
also_copy = [
  "pytest.ini", "mypy.ini", "VERSION", "CHANGELOG.md", "README.md",
  "CONTRIBUTING.md", "LICENSE", "Dockerfile", "docker-compose.yml",
  "sonar-project.properties", ".coveragerc", ".gitignore", ".dockerignore",
  ".pre-commit-config.yaml", ".github/", "install/", "scripts/", "docs/",
  "clients/", "runtime/", "templates/", "translations/", "vendor/",
  "devbox.json", ".editorconfig", ".gitattributes", ".gitmodules",
  ".gitleaks.toml", ".lycheeignore",
]

[tool.semantic_release]
# Keep BOTH the PEP-621 [project].version and the semantic-release anchor in
# sync on every release. Listing them together means python-semantic-release
# rewrites both TOML keys when bumping, so packaging metadata (pip, uv,
# importlib.metadata) and the VERSION file stay aligned. See JTN-624.
version_toml = [
  "pyproject.toml:project.version",
  "pyproject.toml:tool.semantic_release.version",
]
version = "1.9.0"
commit_parser = "conventional"
tag_format = "v{version}"
# Regenerate VERSION from the canonical pyproject.toml value on each release.
# Using NEW_VERSION (env var exported by python-semantic-release to
# build_command) avoids relying on shell {version} expansion, which PSR does
# NOT perform — the previous `echo '{version}'` wrote the literal placeholder
# into VERSION on every release.
assets = ["VERSION", "uv.lock"]
# Regenerate VERSION from the canonical pyproject.toml value AND refresh uv.lock
# so the inkypi package version in the lockfile tracks the release bump.
# Without `uv lock`, the lockfile drifts from pyproject.toml and the "Lockfile
# drift" CI check fails on every new PR (see JTN-655).
build_command = "printf '%s\\n' \"$NEW_VERSION\" > VERSION && uv lock"


[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.commit_parser_options]
# Preserve v9 parsing behavior for this repo's squash-merged PR messages.
parse_squash_commits = false
ignore_merge_commits = false


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
