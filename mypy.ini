[mypy]
python_version = 3.13
mypy_path = src
namespace_packages = True
explicit_package_bases = True

# Every module, src/ and tests/ alike, is checked with --strict. Say it here,
# once. mypy applies `strict = True` from ANY section to the whole run (a
# per-module `strict` is not per-module), so a list of "strict modules" below
# would only look selective. tests/unit/test_mypy_config.py checks both.
strict = True
# strict leaves this one out.
warn_unreachable = True

# Imports without type information resolve to Any rather than failing.
ignore_missing_imports = True
# `follow_imports = skip` used to be set here. It made mypy never read an
# imported module, so every cross-module call resolved to Any and the src/
# error count sat at a comforting zero while 214 real type mismatches went
# unseen. Following imports is what makes the check mean anything.
follow_imports = normal

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-waitress.*]
ignore_missing_imports = True
