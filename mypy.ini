[mypy]
python_version = 3.13
# scripts/ is on the path so that restore_config.py can resolve its sibling
# backup_config.py (it imports it through sys.path at run time).
mypy_path = src:scripts
namespace_packages = True
explicit_package_bases = True

# Every module, src/ and tests/ alike, is checked with --strict. Say it here,
# once. mypy applies `strict = True` from ANY section to the whole run (a
# per-module `strict` is not per-module), so a list of "strict modules" below
# would only look selective. tests/unit/test_mypy_config.py checks both.
strict = True
# strict leaves these out.
warn_unreachable = True
# Each of these has caught something real here: a guard on a value whose type
# already rules out what it guards against, a name read after a try that may
# not have bound it, `if image:` on an object that is always truthy, a call
# into a deprecated API, a bare `# type: ignore` hiding which error it means.
enable_error_code = redundant-expr, truthy-bool, possibly-undefined, deprecated, ignore-without-code

# `follow_imports = skip` used to be set here. It made mypy never read an
# imported module, so every cross-module call resolved to Any and the src/
# error count sat at a comforting zero while 214 real type mismatches went
# unseen. Following imports is what makes the check mean anything.
follow_imports = normal

# A third-party import with no type information fails the check rather than
# quietly becoming Any. Libraries that have a stub package get it from
# pyproject.toml's dev dependency group (types-psutil, types-jsonschema, ...). The ones
# below have no types anywhere: no inline annotations, no py.typed marker and
# no stub package. tests/unit/test_mypy_config.py keeps this list explicit.

# Installed everywhere, untyped.
[mypy-feedparser.*,recurring_ical_events.*,pi_heif.*]
ignore_missing_imports = True

# Only installed on the device: panel and GPIO drivers, the systemd journal
# bindings, and the other boards the vendored Waveshare driver supports.
[mypy-inky.*,gpiozero.*,spidev.*,cysystemd.*,Jetson.*,Hobot.*]
ignore_missing_imports = True

# Optional or platform-only, untyped: rjsmin is used by build_assets.py when it
# is installed and falls back otherwise; memray is a Linux-only dev dependency
# (memory_diff.py), so a macOS checkout does not have it.
[mypy-rjsmin.*,memray.*]
ignore_missing_imports = True

# These packages may not write `Any` at all. A decoded JSON dict is
# utils.json_types.JsonObject; anything else gets its real type. Untyped
# hardware libraries are still Any, but by inference, not by annotation.
# Widen this list as other packages get there.
[mypy-app_setup.*,display.*,services.*]
disallow_any_explicit = True
