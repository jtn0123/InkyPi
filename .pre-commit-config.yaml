# `pre-commit install` sets up both hook types, so commit messages are checked too.
default_install_hook_types: [pre-commit, commit-msg]

# Vendored and generated files keep their upstream bytes: several are pinned
# by hash, and main.css is rebuilt by scripts/build_css.py.
exclude: ^(src/static/vendor/|src/templates/icons/|src/static/fonts/|vendor/|clients/android/assets/|tests/fixtures/|tests/snapshots/|src/static/styles/main\.css$|src/display/waveshare_epd/)

repos:
  # CI runs these on the files each change touches (the lint job), so older
  # files are cleaned up as they are edited rather than in one sweep.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Ruff, Black and mypy run from the project's virtualenv, so they are the
  # versions pinned in install/requirements-dev.txt that CI's lint job uses
  # (scripts/lint.sh), and mypy can import the project's dependencies. Black is
  # the formatter CI enforces; ruff only lints.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, autofix)
        language: system
        entry: scripts/precommit_tool.sh ruff check --fix --exit-non-zero-on-fix --force-exclude
        types: [python]
        files: ^(src|tests|scripts)/
      - id: black
        name: black (format)
        language: system
        entry: scripts/precommit_tool.sh black
        types: [python]
        files: ^(src|tests|scripts)/
      - id: mypy
        name: mypy src/ (CI's blocking pass)
        language: system
        entry: scripts/precommit_tool.sh mypy src
        pass_filenames: false
        files: ^src/.*\.py$

  # Biome lints the web UI's scripts; biome.json holds the rules and turns the
  # formatter off, and `biome ci` never rewrites files. The official mirror is
  # a `language: node` hook, so pre-commit installs the pinned @biomejs/biome
  # into its own cache: the repo gets no package.json or node_modules/. The rev
  # is the Biome version (the mirror tags match Biome releases); CI installs
  # the same one (ci.yml), and tests/unit/test_biome_config.py checks they
  # agree. Run it on every script with `pre-commit run biome-ci --all-files`.
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.6.7
    hooks:
      - id: biome-ci
        args: [--error-on-warnings]
        files: ^src/static/scripts/.*\.js$

  # The hook's own entry scans only the staged changes. The old
  # `detect --source=.` args were appended to that entry and made gitleaks
  # exit with "unknown flag: --source". CI scans the full history separately
  # (.github/workflows/gitleaks.yml).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Run the lightweight browser smoke gate automatically for staged frontend files.
  - repo: local
    hooks:
      # main.css is committed and CI no longer rebuilds it
      # (tests/unit/test_main_css_current.py fails when it is stale). When a
      # stylesheet partial changes, rebuild it; pre-commit then stops the
      # commit so the rebuilt main.css can be staged with the partial.
      - id: build-css
        name: rebuild main.css from the partials
        language: system
        entry: scripts/precommit_tool.sh python scripts/build_css.py
        pass_filenames: false
        files: ^src/static/styles/(_imports\.css|partials/)
      - id: browser-smoke-gate
        name: Browser smoke gate (frontend changes)
        language: script
        entry: scripts/precommit_browser_warning.sh
        pass_filenames: false
        files: ^src/(static|templates)/
        stages: [pre-commit]
